services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://studybuddy:studybuddy@db:5432/studybuddy
    ports:
      - "8081:8081"
    depends_on:
      - db
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy
      POSTGRES_DB: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
