services:
  bot:
    build: .
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    environment:
      REQUIRE_CLOUD_DB: ${REQUIRE_CLOUD_DB:-true}
    ports:
      - "8081:8081"
    restart: unless-stopped
  db:
    image: postgres:14
    profiles:
      - localdb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studybuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studybuddy}
      POSTGRES_DB: ${POSTGRES_DB:-studybuddy}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db_data:
