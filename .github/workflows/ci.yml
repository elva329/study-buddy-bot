name: CI and EC2 Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database smoke check
        env:
          DATABASE_URL: sqlite:///./test-ci.db
        run: |
          python - <<'PY'
          import importlib
          import os
          import sys

          sys.modules.pop('database.db_client', None)
          import database.db_client as db_client
          db_client = importlib.reload(db_client)

          db_client.log_message(42, 'hello bot', 'user')
          db_client.log_event(42, 'pdf_uploaded', {'filename': 'notes.pdf'})
          db_client.log_quiz_attempt_db(42, 5)
          db_client.log_quiz_score(42, 4, 5, 80, {'Databases': (3, 4)})

          history = db_client.get_quiz_history(42, limit=5)
          assert len(history) == 1 and history[0][1] == 5

          total_quizzes, avg_score, best_score, worst_score, weak_topic = db_client.get_quiz_stats(42)
          assert total_quizzes == 1
          assert avg_score == 80
          assert best_score == 80
          assert worst_score == 80
          assert weak_topic == 'Databases'

          progress = db_client.get_user_progress_db(42)
          assert len(progress) == 1
          assert progress[0]['num_questions'] == 5

          overview = db_client.get_db_overview()
          assert overview['messages'] >= 1
          assert overview['events'] >= 1
          assert overview['quiz_attempts'] >= 1
          assert overview['quiz_scores'] >= 1
          assert overview['topic_scores'] >= 1

          print('Database smoke check passed.')
          PY

      - name: Build Docker image
        run: |
          docker build -t study-buddy-bot:ci .

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Install git if not present
            if ! command -v git &> /dev/null; then
              echo "Installing git..."
              sudo dnf install -y git
            fi
            
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi
            
            # Install Docker Compose plugin if not present
            if ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose plugin..."
              sudo dnf install -y docker-compose-plugin
            fi
            
            # Clone or update repository
            if [ ! -d ~/study-buddy-bot ]; then
              echo "Cloning repository..."
              cd ~
              git clone https://github.com/${{ github.repository }}.git study-buddy-bot
            else
              echo "Updating repository..."
              cd ~/study-buddy-bot
              # Fetch latest changes and reset (cleaner than pull)
              git fetch origin
              git reset --hard origin/main
            fi
            
            # Ensure we're in the right directory
            cd ~/study-buddy-bot
            
            # IMPORTANT: Preserve existing .env file
            # Backup existing .env if it exists
            if [ -f .env ]; then
              echo "Preserving existing .env file..."
              cp .env .env.backup
            fi
            
            # Stop existing containers
            echo "Stopping existing containers..."
            docker compose down || true
            
            # Build and start containers
            echo "Building and starting containers..."
            docker compose up -d --build
            
            # Restore .env if it was overwritten (though compose shouldn't overwrite it)
            if [ -f .env.backup ] && [ ! -f .env ]; then
              mv .env.backup .env
            elif [ -f .env.backup ]; then
              rm .env.backup
            fi
            
            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -f
            
            # Show running containers
            echo "Container status:"
            docker compose ps
            
            echo "✅ Deployment completed successfully!"
          EOF