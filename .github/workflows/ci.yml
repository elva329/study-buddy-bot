name: CI and EC2 Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database smoke check
        env:
          DATABASE_URL: sqlite:///./test-ci.db
        run: |
          python - <<'PY'
          import importlib
          import os
          import sys

          sys.modules.pop('database.db_client', None)
          import database.db_client as db_client
          db_client = importlib.reload(db_client)

          db_client.log_message(42, 'hello bot', 'user')
          db_client.log_event(42, 'pdf_uploaded', {'filename': 'notes.pdf'})
          db_client.log_quiz_attempt_db(42, 5)
          db_client.log_quiz_score(42, 4, 5, 80, {'Databases': (3, 4)})

          history = db_client.get_quiz_history(42, limit=5)
          assert len(history) == 1 and history[0][1] == 5

          total_quizzes, avg_score, best_score, worst_score, weak_topic = db_client.get_quiz_stats(42)
          assert total_quizzes == 1
          assert avg_score == 80
          assert best_score == 80
          assert worst_score == 80
          assert weak_topic == 'Databases'

          progress = db_client.get_user_progress_db(42)
          assert len(progress) == 1
          assert progress[0]['num_questions'] == 5

          overview = db_client.get_db_overview()
          assert overview['messages'] >= 1
          assert overview['events'] >= 1
          assert overview['quiz_attempts'] >= 1
          assert overview['quiz_scores'] >= 1
          assert overview['topic_scores'] >= 1

          print('Database smoke check passed.')
          PY

      - name: Build Docker image
        run: |
          docker build -t study-buddy-bot:ci .

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd ~/study-buddy-bot
          git pull origin main

          # Build and restart the service using Docker Compose
          docker compose down || true
          docker compose up -d --build
          EOF
