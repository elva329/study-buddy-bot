name: CI and EC2 Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database smoke check
        env:
          DATABASE_URL: sqlite:///./test-ci.db
        run: |
          python - <<'PY'
          import importlib
          import sys

          sys.modules.pop('database.db_client', None)
          import database.db_client as db_client
          db_client = importlib.reload(db_client)

          db_client.log_message(42, 'hello bot', 'user')
          db_client.log_event(42, 'pdf_uploaded', {'filename': 'notes.pdf'})
          db_client.log_quiz_attempt_db(42, 5)
          db_client.log_quiz_score(42, 4, 5, 80, {'Databases': (3, 4)})

          conn = db_client.get_conn()
          cur = conn.cursor()

          cur.execute('SELECT id, username, email FROM users WHERE id = ?', (42,))
          assert cur.fetchone() is not None

          cur.execute('SELECT id, title, category, total_questions FROM quizzes ORDER BY id DESC LIMIT 1')
          assert cur.fetchone() is not None

          cur.execute('SELECT score, num_questions, percent, passed, weak_topic, topic_breakdown, status FROM quiz_attempts WHERE user_id = ? ORDER BY timestamp DESC LIMIT 1', (42,))
          attempt_row = cur.fetchone()
          assert attempt_row is not None
          assert attempt_row[3] == 1
          assert attempt_row[4] == 'Databases'
          assert attempt_row[5] is not None
          assert attempt_row[6] in ('passed', 'failed')

          cur.execute('PRAGMA table_info(messages)')
          message_columns = [column[1] for column in cur.fetchall()]
          assert 'message' not in message_columns

          cur.execute('PRAGMA foreign_key_list(quiz_attempts)')
          quiz_attempts_fks = cur.fetchall()
          assert any(fk[2] == 'users' for fk in quiz_attempts_fks)
          assert any(fk[2] == 'quizzes' for fk in quiz_attempts_fks)

          cur.execute('PRAGMA index_list(quiz_attempts)')
          quiz_attempts_indexes = [index[1] for index in cur.fetchall()]
          assert 'idx_quiz_attempts_user_timestamp' in quiz_attempts_indexes

          cur.execute('PRAGMA index_list(messages)')
          message_indexes = [index[1] for index in cur.fetchall()]
          assert 'idx_messages_user_timestamp' in message_indexes

          cur.close()
          conn.close()

          history = db_client.get_quiz_history(42, limit=5)
          assert len(history) == 1 and history[0][1] == 5

          total_quizzes, avg_score, best_score, worst_score, weak_topic = db_client.get_quiz_stats(42)
          assert total_quizzes == 1
          assert avg_score == 80
          assert best_score == 80
          assert worst_score == 80
          assert weak_topic == 'Databases'

          progress = db_client.get_user_progress_db(42)
          assert len(progress) == 1
          assert progress[0]['num_questions'] == 5

          overview = db_client.get_db_overview()
          assert overview['users'] >= 1
          assert overview['quizzes'] >= 1
          assert overview['messages'] >= 1
          assert overview['events'] >= 1
          assert overview['quiz_attempts'] >= 1

          print('Database smoke check passed.')
          PY

      - name: Run test suite
        env:
          DATABASE_URL: sqlite:///./test-ci.db
          TELEGRAM_BOT_TOKEN: test-token
        run: |
          pytest -q

      - name: Build Docker image
        run: |
          docker build -t study-buddy-bot:ci .

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2
        run: |
          tar -czf /tmp/study-buddy-bot.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=.venv \
            --exclude=venv \
            --exclude=logs \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=.mypy_cache \
            --exclude=test-ci.db \
            -C "$GITHUB_WORKSPACE" .

          scp -o StrictHostKeyChecking=no /tmp/study-buddy-bot.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/study-buddy-bot.tar.gz

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            
            # Install Docker Compose plugin if not present
            if ! sudo docker compose version &> /dev/null; then
              echo "Installing Docker Compose plugin..."
              sudo dnf install -y docker-compose-plugin
            fi

            # Prepare deployment directory and clear old code, but keep .env
            mkdir -p ~/study-buddy-bot

            # Preserve the compose env file if it already exists
            if [ -f ~/study-buddy-bot/.env ]; then
              echo "Preserving existing .env file..."
              cp ~/study-buddy-bot/.env /tmp/study-buddy-bot.env.backup
            fi

            find ~/study-buddy-bot -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +

            # Receive the latest code from GitHub Actions
            echo "Deploying latest code bundle..."
            tar -xzf /tmp/study-buddy-bot.tar.gz -C ~/study-buddy-bot
            rm -f /tmp/study-buddy-bot.tar.gz

            # Restore compose env file if it was backed up
            if [ -f /tmp/study-buddy-bot.env.backup ]; then
              mv /tmp/study-buddy-bot.env.backup ~/study-buddy-bot/.env
            fi

            # Ensure we're in the right directory
            cd ~/study-buddy-bot

            # Use cloud DB from .env by default; local db service is profile-gated.
            export COMPOSE_PROFILES=""
            
            # Stop existing containers
            echo "Stopping existing containers..."
            sudo docker compose down || true
            
            # Build and start bot container only (expects DATABASE_URL in .env)
            echo "Building and starting bot container..."
            sudo docker compose up -d --build bot
            
            # Clean up old images
            echo "Cleaning up old Docker images..."
            sudo docker image prune -f
            
            # Show running containers
            echo "Container status:"
            sudo docker compose ps
            
            echo "✅ Deployment completed successfully!"
          EOF